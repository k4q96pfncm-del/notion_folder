<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Notion Folder - macOS Finder View</title>
    <style>
        * {
            box-sizing: border-box;
            user-select: none;
        }

        body {
            margin: 0;
            padding: 20px;
            font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "SF Pro Display", "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: #e5e5e7;
            background-image: radial-gradient(#d1d1d6 1px, transparent 1px);
            background-size: 20px 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .mac-window {
            width: 100%;
            max-width: 820px;
            background: rgba(255, 255, 255, 0.92);
            backdrop-filter: blur(20px);
            border-radius: 12px;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.25), 0 0 0 1px rgba(0, 0, 0, 0.1);
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }

        .window-header {
            height: 42px;
            background: linear-gradient(180deg, #ececec 0%, #e1e1e1 100%);
            display: flex;
            align-items: center;
            padding: 0 16px;
            position: relative;
            border-bottom: 1px solid rgba(0, 0, 0, 0.12);
        }

        .window-buttons {
            display: flex;
            gap: 8px;
            z-index: 2;
        }

        .btn {
            width: 12px;
            height: 12px;
            border-radius: 50%;
            display: inline-block;
            box-shadow: inset 0 0 0 1px rgba(0,0,0,0.1);
        }

        .btn-close { background-color: #ff5f56; border: 0.5px solid #e0443e; }
        .btn-minimize { background-color: #ffbd2e; border: 0.5px solid #dea123; }
        .btn-maximize { background-color: #27c93f; border: 0.5px solid #1aab29; }

        .nav-controls {
            margin-left: 14px;
            z-index: 2;
        }

        .back-btn {
            background: rgba(255, 255, 255, 0.8);
            border: 1px solid rgba(0, 0, 0, 0.2);
            border-radius: 4px;
            padding: 3px 10px;
            font-size: 11px;
            font-weight: 500;
            color: #333;
            cursor: pointer;
            transition: background 0.15s;
        }

        .back-btn:hover:not(:disabled) {
            background: #ffffff;
            box-shadow: 0 1px 2px rgba(0,0,0,0.1);
        }

        .back-btn:disabled {
            opacity: 0.35;
            cursor: default;
        }

        .window-title {
            position: absolute;
            left: 50%;
            transform: translateX(-50%);
            font-size: 13px;
            color: #4d4d4d;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .window-title svg {
            width: 14px;
            height: 14px;
            fill: #007aff;
        }

        .window-content {
            padding: 28px;
            min-height: 380px;
            max-height: 580px;
            overflow-y: auto;
            background: #ffffff;
        }

        .folder-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(110px, 1fr));
            gap: 20px 16px;
            justify-items: center;
        }

        .folder-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            width: 106px;
            padding: 8px 6px;
            border-radius: 6px;
            cursor: pointer;
            text-decoration: none;
            color: #1d1d1f;
            transition: background-color 0.15s ease, transform 0.1s ease;
        }

        .folder-item:hover {
            background-color: rgba(0, 125, 250, 0.1);
        }

        .folder-item:active {
            transform: scale(0.96);
            background-color: rgba(0, 125, 250, 0.2);
        }

        /* 일정한 macOS 파란색 폴더 아이콘 디자인 (전체 통일) */
        .mac-folder-wrapper {
            position: relative;
            width: 64px;
            height: 52px;
            margin-bottom: 8px;
            filter: drop-shadow(0 4px 6px rgba(0, 80, 180, 0.2));
        }

        .mac-folder-back {
            position: absolute;
            top: 2px;
            left: 4px;
            width: 24px;
            height: 10px;
            background: linear-gradient(180deg, #64b5f6 0%, #1e88e5 100%);
            border-top-left-radius: 4px;
            border-top-right-radius: 4px;
        }

        .mac-folder-body {
            position: absolute;
            bottom: 0;
            width: 64px;
            height: 44px;
            background: linear-gradient(180deg, #42a5f5 0%, #1565c0 100%);
            border-radius: 5px;
            box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.45);
        }

        .mac-folder-front {
            position: absolute;
            bottom: 0;
            width: 64px;
            height: 38px;
            background: linear-gradient(180deg, rgba(255, 255, 255, 0.25) 0%, rgba(255, 255, 255, 0) 100%),
                        linear-gradient(180deg, #29b6f6 0%, #0277bd 100%);
            border-radius: 4px 4px 5px 5px;
            box-shadow: 0 -1px 2px rgba(0, 0, 0, 0.15), inset 0 1px 0 rgba(255, 255, 255, 0.6);
        }

        .mac-folder-paper {
            position: absolute;
            top: 6px;
            left: 8px;
            width: 48px;
            height: 30px;
            background: #ffffff;
            border-radius: 2px;
            opacity: 0.85;
            box-shadow: 0 1px 2px rgba(0, 0, 0, 0.1);
        }

        .folder-title {
            font-size: 12px;
            line-height: 1.3;
            text-align: center;
            word-break: break-word;
            padding: 2px 4px;
            border-radius: 4px;
            font-weight: 400;
        }

        .folder-item:hover .folder-title {
            color: #0066cc;
            font-weight: 500;
        }

        @media (max-width: 480px) {
            .window-content {
                padding: 16px;
            }
            .folder-grid {
                grid-template-columns: repeat(auto-fill, minmax(90px, 1fr));
                gap: 16px 10px;
            }
        }
    </style>
</head>
<body>

    <div class="mac-window">
        <!-- Top Window Bar -->
        <div class="window-header">
            <div class="window-buttons">
                <span class="btn btn-close"></span>
                <span class="btn btn-minimize"></span>
                <span class="btn btn-maximize"></span>
            </div>
            <div class="nav-controls">
                <button id="back-btn" class="back-btn" onclick="goBack()" disabled>◀ 뒤로</button>
            </div>
            <div id="path-title" class="window-title">
                <svg viewBox="0 0 24 24">
                    <path d="M10 4H4c-1.1 0-1.99.9-1.99 2L2 18c0 1.1.9 2 2 2h16c1.1 0 2-.9 2-2V8c0-1.1-.9-2-2-2h-8l-2-2z"/>
                </svg>
                <span id="header-text">Notion Folder</span>
            </div>
        </div>

        <!-- Window Content Area -->
        <div class="window-content">
            <div id="folder-container" class="folder-grid">
                <p style="color: #888; text-align: center; width: 100%;">로딩 중...</p>
            </div>
        </div>
    </div>

    <script>
        let allPages = [];
        let historyStack = [null]; // null = 최상위 루트 (Home)

        async function init() {
            try {
                const response = await fetch('/api/notion');
                if (response.ok) {
                    const apiData = await response.json();
                    if (Array.isArray(apiData)) {
                        allPages = apiData;
                    }
                }
            } catch (err) {
                console.error('API fetch error, fallback to mock data.', err);
                allPages = [
                    { id: "1", title: "흉터약 바르기", url: "#", parentId: null, hasChildren: false },
                    { id: "2", title: "건강 관리 루틴", url: "#", parentId: null, hasChildren: true },
                    { id: "3", title: "마그네슘-테아닌", url: "#", parentId: "2", hasChildren: false },
                    { id: "4", title: "시카 슬리핑 마스크", url: "#", parentId: "2", hasChildren: false }
                ];
            }
            renderFolder(null);
        }

        function renderFolder(parentId) {
            const container = document.getElementById('folder-container');
            container.innerHTML = '';

            // 현재 parentId와 일치하는 항목만 필터링 (최상위는 parentId가 null)
            const currentItems = allPages.filter(page => page.parentId === parentId);

            // 뒤로가기 버튼 활성화 여부
            document.getElementById('back-btn').disabled = historyStack.length <= 1;

            if (currentItems.length === 0) {
                container.innerHTML = '<p style="color: #999; text-align: center; width: 100%;">비어 있는 폴더입니다.</p>';
                return;
            }

            currentItems.forEach(item => {
                const itemElem = document.createElement('div');
                itemElem.className = 'folder-item';

                // 모든 아이템이 일관된 파란색 맥 폴더 디자인으로 렌더링됨
                itemElem.innerHTML = `
                    <div class="mac-folder-wrapper">
                        <div class="mac-folder-back"></div>
                        <div class="mac-folder-body"></div>
                        <div class="mac-folder-paper"></div>
                        <div class="mac-folder-front"></div>
                    </div>
                    <div class="folder-title">${item.title}</div>
                `;

                // 하위 항목이 있으면 폴더 안으로 이동, 없으면 노션 페이지 새 탭 오픈
                if (item.hasChildren) {
                    itemElem.onclick = () => openFolder(item.id, item.title);
                } else {
                    itemElem.onclick = () => window.open(item.url || '#', '_blank');
                }

                container.appendChild(itemElem);
            });
        }

        function openFolder(folderId, folderTitle) {
            historyStack.push(folderId);
            document.getElementById('header-text').innerText = folderTitle;
            renderFolder(folderId);
        }

        function goBack() {
            if (historyStack.length > 1) {
                historyStack.pop();
                const previousFolderId = historyStack[historyStack.length - 1];
                
                if (previousFolderId === null) {
                    document.getElementById('header-text').innerText = "Notion Folder";
                } else {
                    const parentPage = allPages.find(p => p.id === previousFolderId);
                    document.getElementById('header-text').innerText = parentPage ? parentPage.title : "Notion Folder";
                }

                renderFolder(previousFolderId);
            }
        }

        window.onload = init;
    </script>
</body>
</html>
